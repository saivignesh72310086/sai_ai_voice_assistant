<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai AI Voice Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: radial-gradient(ellipse at center, #0f0f23 0%, #000 70%); color: white; min-height: 100vh; overflow: hidden; position: relative; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%), radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.3) 0%, transparent 50%); animation: aurora 15s ease-in-out infinite alternate; z-index: -1; }
        @keyframes aurora { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        .container { display: flex; flex-direction: column; height: 100vh; }
        .mic-section { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; }
        .mic-orb { width: 220px; height: 220px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; cursor: pointer; box-shadow: 0 0 60px rgba(102, 126, 234, 0.7); transition: all 0.3s; position: relative; }
        .mic-orb:hover { transform: scale(1.08); box-shadow: 0 0 100px rgba(102, 126, 234, 0.9); }
        .mic-orb.active { animation: pulse 1.2s infinite; box-shadow: 0 0 120px rgba(255, 68, 68, 0.9); }
        .mic-orb::before, .mic-orb::after { content: ''; position: absolute; border-radius: 50%; animation: ring 2s infinite linear; }
        .mic-orb::before { width: 280px; height: 280px; background: rgba(102, 126, 234, 0.4); top: -30px; left: -30px; }
        .mic-orb::after { width: 340px; height: 340px; background: rgba(102, 126, 234, 0.2); top: -60px; left: -60px; animation-delay: 1s; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        @keyframes ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        #status { font-size: 1.8rem; font-weight: 600; text-align: center; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #history { height: 250px; overflow-y: auto; padding: 25px; background: rgba(255,255,255,0.08); backdrop-filter: blur(25px); margin: 25px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .message { margin: 12px 0; padding: 16px 24px; border-radius: 30px; opacity: 0; animation: slideIn 0.5s forwards; backdrop-filter: blur(15px); }
        .user { background: rgba(52, 152, 219, 0.3); margin-left: 50px; }
        .sai { background: rgba(39, 174, 96, 0.3); margin-right: 50px; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        .bottom-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 700px; background: rgba(255,255,255,0.12); padding: 20px; border-radius: 50px; backdrop-filter: blur(30px); box-shadow: 0 15px 50px rgba(0,0,0,0.5); display: flex; gap: 15px; align-items: center; }
        #textInput { flex: 1; background: rgba(255,255,255,0.2); border: none; border-radius: 30px; padding: 18px 25px; color: white; font-size: 16px; outline: none; }
        #textInput::placeholder { color: rgba(255,255,255,0.6); }
        #sendBtn { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 30px; padding: 18px 30px; color: white; font-weight: 600; cursor: pointer; transition: transform 0.3s; }
        #sendBtn:hover { transform: scale(1.08); }
        #continuous, #tomMode { width: 45px; height: 24px; accent-color: #667eea; cursor: pointer; }
        .toggle-label { font-size: 15px; user-select: none; }
        @media (max-width: 768px) { .mic-orb { width: 160px; height: 160px; } .bottom-bar { bottom: 15px; width: 95%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="mic-section">
            <div class="mic-orb" id="micBtn" title="Click to talk">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 60px;">🎤</div>
            </div>
            <div id="status">SAI AI • Ready</div>
        </div>
        <div id="history"></div>
    </div>
    <div class="bottom-bar">
        <label style="display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); cursor: pointer;">
            <input type="checkbox" id="continuous"> 
            <span class="toggle-label">🔄</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); cursor: pointer;">
            <input type="checkbox" id="tomMode"> 
            <span class="toggle-label">🐱 Tom</span>
        </label>
        <input type="text" id="textInput" placeholder="Type command...">
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const API_URL = '/api/command';
        let isListening = false;
        let tomMode = false;
        const recognition = 'webkitSpeechRecognition' in window ? new webkitSpeechRecognition() : null;
        const synth = window.speechSynthesis;

        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const historyEl = document.getElementById('history');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const continuousCb = document.getElementById('continuous');
        const tomCb = document.getElementById('tomMode');

        tomCb.onchange = async (e) => { 
            tomMode = e.target.checked; 
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: `tom mode ${tomMode ? 'on' : 'off'}`})
            });
        };

        if (recognition) {
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('active');
                statusEl.textContent = 'Listening... 🔴';
            };
            
            recognition.onresult = async (e) => {
                let final = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                }
                if (final) await processCommand(final);
            };
            
            recognition.onerror = recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('active');
                statusEl.textContent = 'SAI AI • Ready';
            };
        }

        micBtn.onclick = () => recognition && (isListening ? recognition.stop() : recognition.start());
        continuousCb.onchange = (e) => e.target.checked && recognition?.start();
        
        async function processCommand(cmd) {
            addMessage('You', cmd);
            statusEl.textContent = 'Sai thinking...';
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command: cmd})
                });
                const data = await res.json();
                const response = data.response;
                speak(response);
                addMessage('Sai', response);
            } catch (e) {
                addMessage('Sai', 'Backend error');
            }
            statusEl.textContent = 'SAI AI • Ready';
            textInput.value = '';
        }

        sendBtn.onclick = textInput.onkeypress = async (e) => {
            if (e.key === 'Enter' || e.type === 'click') {
                const cmd = textInput.value.trim();
                if (cmd) await processCommand(cmd);
            }
        };

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender === 'You' ? 'user' : 'sai'}`;
            div.textContent = `${sender}: ${text}`;
            historyEl.appendChild(div);
            historyEl.scrollTop = historyEl.scrollTop = historyEl.scrollHeight;
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            synth.speak(utterance);
        }

        // Welcome
        speak('Sai AI ready!');
        addMessage('Sai', 'Voice assistant ready! Click mic or type.');
    </script>
</body>
</html>
